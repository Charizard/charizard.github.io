{%- if site.owner.github %}<li><a href="https://github.com/{{ site.owner.github }}" rel="me">GitHub</a></li>{% endif -%}
{%- if site.owner.twitter %}<li><a href="https://twitter.com/{{ site.owner.twitter }}" rel="me">Twitter</a></li>{% endif -%}
{%- if site.owner.stackoverflow %}<li><a href="https://stackoverflow.com/users/{{ site.owner.stackoverflow }}" rel="me">Stack Overflow</a></li>{% endif -%}
{%- if site.owner.linkedin %}<li><a href="https://linkedin.com/in/{{ site.owner.linkedin }}" rel="me">LinkedIn</a></li>{% endif -%}
