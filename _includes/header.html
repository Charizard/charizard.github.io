<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation -%}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url contains item.url and item.url != '/' %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </nav>
  </div>
</header>
